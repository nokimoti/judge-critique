<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文面喧嘩 判定ログ ──のきもち判定所</title>
<style>
  :root{
    --bg:#0c0d0f; --panel:#17181c; --panel-hover:#1e1f24;
    --text:#ECEDEA; --muted:#8B8E94; --shu:#E14B3A; --shu-bright:#EF6A54;
    --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;padding:56px 20px 90px;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.7;
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px;margin:0 auto}
  header{margin:0 0 2.4rem}
  h1{font-size:1.55rem;letter-spacing:.04em;margin:0;color:#fff;
    display:inline-block;border-bottom:2px solid var(--shu);padding-bottom:.5rem}
  .sub{color:var(--muted);font-size:.85rem;margin:1rem 0 0;line-height:1.85}
  .sub a{color:var(--shu-bright);text-decoration:none}
  .sub a:hover{text-decoration:underline}
  ul{list-style:none;padding:0;margin:0}
  li{margin:0 0 12px}
  a.entry{display:block;text-decoration:none;color:inherit;
    background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--shu);
    border-radius:8px;padding:15px 18px;
    transition:background .15s ease,border-color .15s ease,transform .15s ease}
  a.entry:hover{background:var(--panel-hover);border-left-color:var(--shu-bright);transform:translateX(2px)}
  a.entry:focus-visible{outline:2px solid var(--shu);outline-offset:3px}
  .e-top{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap}
  .e-no{color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}
  .e-title{font-weight:700;font-size:1.06rem;color:#f2f2f0}
  .e-meta{margin-top:.45rem;font-size:.78rem;color:var(--muted);display:flex;gap:1.1rem;flex-wrap:wrap}
  .win{color:var(--shu-bright);font-weight:700}
  footer{margin-top:3rem;padding-top:1.6rem;border-top:1px solid var(--line);
    font-size:.78rem;color:var(--muted);line-height:1.9}
  footer a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
  footer a:hover{color:var(--shu-bright)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>文面喧嘩 判定ログ</h1>
    <p class="sub">文字だけの果たし合いを、まず判定し、続いて批評する。物差しは <a href="https://note.com/nokimoti_pigg/n/nfa68c384b213">ネット喧嘩の判定論</a> に基づく。</p>
  </header>

  <!-- ARCHIVE:START 新しい判定はこのul内の先頭へ挿入 -->
  <ul>
    <li>
      <a class="entry" href="hantei01.html">
        <div class="e-top"><span class="e-no">No.01</span><span class="e-title">伊崎 対 弾丸ボーイ</span></div>
        <div class="e-meta"><span class="win">勝 弾丸ボーイ</span><span>2026/06/22</span></div>
      </a>
    </li>
  </ul>
  <!-- ARCHIVE:END -->

  <footer>
    <p>のきもち判定所 ／ <a href="https://note.com/nokimoti_pigg">note.com/nokimoti_pigg</a></p>
  </footer>
</div>
</body>
</html>
